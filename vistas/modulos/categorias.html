 <!-- Content Wrapper. Contains page content -->
 <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <h1>
        Administrar categorias
        
      </h1>
      <ol class="breadcrumb">
        <li><a href="inicio"><i class="fa fa-dashboard"></i> Inicio</a></li>
        <li class="active"> Administrar categorias</li>
      </ol>
    </section>

    <!-- Main content -->
    <section class="content">

      <!-- Default box -->
      <div class="box">
        <div class="box-header with-border">
        <button class="btn btn-primary" data-toggle="modal" data-target="#modalAgregarCategoria">
          Agregar categoria
        </button>



        </div>
        <div class="box-body">
        <table class="table table-bordered table-striped dt-responsive tablas">
                <thead>
                <tr>
                  <th style="width:10px">#</th>
                  <th>Categoria</th>
                  <th>Acciones</th>
                </tr>
                </thead>
                  <tbody>
                    <tr>
                      <td>1</td>
                      <td>Equipo electromecanico</td>
                      <td>
                        <div class="btn-group">
                        <button class="btn btn-warning"><i class="fa fa-pencil"></i></button>
                        <button class="btn btn-success"><i class="fa fa-times"></i></button>
                        </div>
                      </td>
                    </tr>           
                    
                    <tr>
                      <td>2</td>
                      <td>Equipo de limpieza</td>
                        <td>
                        <div class="btn-group">
                        <button class="btn btn-warning"><i class="fa fa-pencil"></i></button>
                        <button class="btn btn-success"><i class="fa fa-times"></i></button>
                        </div>
                        </td>
                    </tr>     

                  </tbody>
                  
              </table>
        </div>
      
      </div>
    

    </section>

  </div>

   
  <!--================================================================
  =                     MODAL AGREGAR USUARIO                          =
  ===================================================================-->

  <div id="modalAgregarCategoria" class="modal fade" role=dialog>
    
    <div class="modal-dialog">
      <div class="modal-content">
        <form role="form" method="post">
          <!--================================================================
          =                     CABEZA DEL MODAL                           =
          ===================================================================-->
          <div class="modal-header" style="background:#3c8dbc;color:white">
            <button type="button" class="close" data-dismiss="modal">&times;</button>
            <h4 class="modal-title">Agregar Categoría</h4>
          </div>
          <!--================================================================
          =                     CUERPO DEL MODAL                           =
          ===================================================================-->
          <div class="modal-body">
            <div class="box-body">
              <!--entrada para el nombre-->
                <div class="form-group">
                  <div class="input-group">
                    <span class="input-group-addon"><i class="fa fa-th"></i></span>
                    <input type="text" class="form-control input-lg" name="nuevaCategoria" placeholder="Ingresar Categoria" required>

                  </div>
                </div>
             </div>
          </div>
          <!--================================================================
            =                     PIE DEL MODAL                           =
          ===================================================================-->
          <div class="modal-footer ">
            <button type="button" class="btn btn-default pull-left" data-dismiss="modal">Salir</button>

            <button type="submit" class="btn btn-primary">Guardar Categoria</button>
          </div>
        </form>  
      </div>

    </div>
  
  </div>
